[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diqds"
version = "0.1.0"
description = "Device-independent quantum digital signatures: reimplementation of Fan et al., PRA 114, 032617 (2026)"
requires-python = ">=3.10"
dependencies = ["qiskit>=1.0", "qiskit-aer>=0.14", "numpy>=1.26", "scipy>=1.11"]

[tool.setuptools]
packages = ["diqds"]
